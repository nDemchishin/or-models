name: Refresh OpenRouter snapshot

on:
  schedule:
    - cron: "0 6 * * 1"   # каждый понедельник 06:00 UTC (~09:00 MSK)
  workflow_dispatch:       # ручной запуск из UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from latest API
        run: python3 build.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes — skipping commit."
          fi
